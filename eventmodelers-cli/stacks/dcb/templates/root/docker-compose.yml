# Everything the service needs runs here (ADR-030): `npm run infra:start`, or `npm run db:start` for Postgres alone.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dcb
      POSTGRES_PASSWORD: dcb
      POSTGRES_DB: dcb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal runs the external automations' workflows (ADR-031, ADR-033). Its own databases (temporal,
  # temporal_visibility) live on the same Postgres server; this one-off job creates or upgrades them.
  # Adapted from temporalio/samples-server compose (docker-compose-postgres.yml).
  temporal-admin-tools:
    image: temporalio/admin-tools:1.31.0
    restart: on-failure:6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=dcb
      - POSTGRES_PWD=dcb
      - POSTGRES_SEEDS=postgres
      - SQL_PASSWORD=dcb
    volumes:
      - ./docker/temporal:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.31.0
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=dcb
      - POSTGRES_PWD=dcb
      - POSTGRES_SEEDS=postgres
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.0
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    volumes:
      - ./docker/temporal:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  # Temporal's web UI: every workflow, its retries and why it failed.
  temporal-ui:
    image: temporalio/ui:2.49.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"
